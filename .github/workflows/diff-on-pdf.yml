name: Automated PDF Visual Diff

on:
  push:
    paths:
      - '**.pdf'

jobs:
  visual-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retain full history to grab historical versions

      - name: Get Changed PDF Files
        id: changed-pdfs
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.pdf

      - name: Install diff-pdf Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y make automake g++ libpoppler-glib-dev poppler-utils libwxgtk3.2-dev

      - name: Build diff-pdf tool
        run: |
          git clone https://github.com/vslavik/diff-pdf.git
          cd diff-pdf
          ./bootstrap
          ./configure
          make
          sudo make install

      - name: Generate Visual Diffs
        if: steps.changed-pdfs.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-pdfs.outputs.all_changed_files }}
        run: |
          mkdir -p pdf-diffs-output
          
          for file in ${CHANGED_FILES}; do
            echo "Processing visual differences for: $file"
            
            # Form clean names for directories and temporary storage
            safe_name=$(echo "$file" | tr '/' '_')
            mkdir -p "temp_diff"
            
            # Fetch the base reference (what the file looked like before your changes)
            git show "origin/${{ github.base_ref }}:$file" > "temp_diff/base.pdf" 2>/dev/null || true
            
            # If the file didn't exist in the base branch, write a placeholder or skip
            if [ ! -s "temp_diff/base.pdf" ]; then
              echo "File $file is newly added. No base version to compare. Skipping diff."
              continue
            fi
            
            # Run diff-pdf using the built binary
            diff-pdf --skip-identical --output-diff="pdf-diffs-output/diff_${safe_name}" "temp_diff/base.pdf" "$file" || true
          done

      - name: Upload Visual Diff Results
        if: steps.changed-pdfs.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-pdf-diffs
          path: pdf-diffs-output/
