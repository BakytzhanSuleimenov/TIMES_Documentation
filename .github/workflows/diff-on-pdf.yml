name: Automated PDF Textual Diff

on:
  push:
    paths:
      - '**.pdf'

jobs:
  text-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed PDF Files
        id: changed-pdfs
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.pdf

      - name: Install Poppler Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate Consolidated Text Diff
        if: steps.changed-pdfs.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-pdfs.outputs.all_changed_files }}
        run: |
          touch unified_diff.patch
          
          for file in ${CHANGED_FILES}; do
            echo "==== Generating Text Diff for: $file ====" >> unified_diff.patch
            
            mkdir -p temp_text
            
            # Fetch base file version
            git show "origin/${{ github.base_ref }}:$file" > temp_text/base.pdf 2>/dev/null || true
            
            if [ ! -s temp_text/base.pdf ]; then
              echo "[New PDF File Added (No Previous History)]" >> unified_diff.patch
              echo "" >> unified_diff.patch
              continue
            fi
            
            # Convert both base and head versions to plain text
            pdftotext temp_text/base.pdf temp_text/base.txt
            pdftotext "$file" temp_text/head.txt
            
            # Perform text comparison and append output
            diff -u temp_text/base.txt temp_text/head.txt >> unified_diff.patch || true
            echo -e "\n\n" >> unified_diff.patch
          done
          
          # Print output summary in Action log
          cat unified_diff.patch

      - name: Upload Text Diff Artifact
        if: steps.changed-pdfs.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: textual-pdf-diffs
          path: unified_diff.patch
